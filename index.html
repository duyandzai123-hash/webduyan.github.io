<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Lý & Cho Mượn Thiết Bị Trường Học</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-indigo-700 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i class="fa-solid me-2 fa-school text-2xl text-indigo-200"></i>
                <h1 class="font-bold text-xl tracking-wide">QUẢN LÝ THIẾT BỊ TRƯỜNG HỌC</h1>
            </div>
            <nav class="flex space-x-2 sm:space-x-4">
                <button onclick="switchTab('devices')" id="tab-btn-devices" class="px-3 py-2 rounded-lg text-sm font-medium bg-indigo-800 text-white transition flex items-center gap-2">
                    <i class="fa-solid fa-boxes-stacked"></i>
                    <span>Kho thiết bị</span>
                </button>
                <button onclick="switchTab('borrow')" id="tab-btn-borrow" class="px-3 py-2 rounded-lg text-sm font-medium hover:bg-indigo-600 text-indigo-100 transition flex items-center gap-2">
                    <i class="fa-solid fa-hand-holding-hand"></i>
                    <span>Tạo phiếu mượn</span>
                </button>
                <button onclick="switchTab('logs')" id="tab-btn-logs" class="px-3 py-2 rounded-lg text-sm font-medium hover:bg-indigo-600 text-indigo-100 transition flex items-center gap-2">
                    <i class="fa-solid fa-clipboard-list"></i>
                    <span>Danh sách mượn</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">

        <!-- TAB 1: KHO THIẾT BỊ -->
        <section id="tab-devices" class="space-y-6">
            <!-- Thống kê nhanh & Bộ lọc -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center space-x-4">
                    <div class="p-3 bg-blue-100 text-blue-600 rounded-lg"><i class="fa-solid fa-microscope text-2xl"></i></div>
                    <div>
                        <p class="text-xs font-semibold text-slate-500 uppercase">Tổng loại thiết bị</p>
                        <h3 id="stat-total-types" class="text-2xl font-bold text-slate-800">0</h3>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center space-x-4">
                    <div class="p-3 bg-emerald-100 text-emerald-600 rounded-lg"><i class="fa-solid fa-check-circle text-2xl"></i></div>
                    <div>
                        <p class="text-xs font-semibold text-slate-500 uppercase">Sẵn sàng cho mượn</p>
                        <h3 id="stat-available" class="text-2xl font-bold text-slate-800">0</h3>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center space-x-4">
                    <div class="p-3 bg-amber-100 text-amber-600 rounded-lg"><i class="fa-solid fa-clock text-2xl"></i></div>
                    <div>
                        <p class="text-xs font-semibold text-slate-500 uppercase">Đang được mượn</p>
                        <h3 id="stat-borrowed" class="text-2xl font-bold text-slate-800">0</h3>
                    </div>
                </div>
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center space-x-4">
                    <div class="p-3 bg-rose-100 text-rose-600 rounded-lg"><i class="fa-solid fa-triangle-exclamation text-2xl"></i></div>
                    <div>
                        <p class="text-xs font-semibold text-slate-500 uppercase">Báo hỏng / Bảo trì</p>
                        <h3 id="stat-broken" class="text-2xl font-bold text-slate-800">0</h3>
                    </div>
                </div>
            </div>

            <!-- Thanh tìm kiếm & Nút thêm thiết bị -->
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row gap-4 items-center justify-between">
                <div class="relative w-full md:w-96">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="search-device" oninput="renderDevices()" placeholder="Tìm tên thiết bị, mã đồ dùng..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
                <div class="flex gap-2 w-full md:w-auto">
                    <select id="filter-category" onchange="renderDevices()" class="px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="">Tất cả danh mục</option>
                        <option value="Thực hành">Thực hành Lý - Hóa - Sinh</option>
                        <option value="Công nghệ">Công nghệ & Máy tính</option>
                        <option value="Thể thao">Dụng cụ Thể thao</option>
                        <option value="Âm nhạc">Dụng cụ Âm nhạc</option>
                    </select>
                    <button onclick="openAddDeviceModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-medium transition flex items-center gap-2 whitespace-nowrap">
                        <i class="fa-solid fa-plus"></i> Thêm thiết bị mới
                    </button>
                </div>
            </div>

            <!-- Lưới hiển thị danh sách thiết bị -->
            <div id="device-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Javascript rendered -->
            </div>
        </section>

        <!-- TAB 2: TẠO PHIẾU MƯỢN -->
        <section id="tab-borrow" class="hidden max-w-2xl mx-auto bg-white p-6 sm:p-8 rounded-xl border border-slate-200 shadow-sm">
            <h2 class="text-xl font-bold text-slate-800 mb-6 pb-3 border-b flex items-center gap-2">
                <i class="fa-solid fa-file-signature text-indigo-600"></i>
                Tạo Phiếu Cho Mượn Thiết Bị
            </h2>
            <form id="borrow-form" onsubmit="handleCreateBorrow(event)" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Chọn thiết bị mượn <span class="text-rose-500">*</span></label>
                    <select id="borrow-device-id" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                        <!-- Javascript options -->
                    </select>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Họ và tên người mượn <span class="text-rose-500">*</span></label>
                        <input type="text" id="borrower-name" required placeholder="Nguyễn Văn A" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Đối tượng / Lớp <span class="text-rose-500">*</span></label>
                        <input type="text" id="borrower-role" required placeholder="Lớp 11A1 / Giáo viên Vật Lý" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Số lượng mượn <span class="text-rose-500">*</span></label>
                        <input type="number" id="borrow-quantity" min="1" value="1" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold text-slate-700 mb-1">Ngày hẹn trả <span class="text-rose-500">*</span></label>
                        <input type="date" id="borrow-due-date" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-1">Mục đích mượn / Ghi chú</label>
                    <textarea id="borrow-purpose" rows="3" placeholder="Sử dụng cho tiết thực hành Hóa học tiết 3..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                </div>

                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-semibold text-sm transition shadow-sm">
                    Xác nhận cho mượn
                </button>
            </form>
        </section>

        <!-- TAB 3: DANH SÁCH NGƯỜI MƯỢN / LỊCH SỬ -->
        <section id="tab-logs" class="hidden space-y-6">
            <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                <div class="p-4 border-b border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-4">
                    <h2 class="font-bold text-slate-800 text-lg flex items-center gap-2">
                        <i class="fa-solid fa-users text-indigo-600"></i>
                        Theo Dõi Người Mượn & Trả Đồ
                    </h2>
                    <div class="flex items-center gap-2">
                        <select id="filter-log-status" onchange="renderLogs()" class="px-3 py-1.5 border border-slate-300 rounded-lg text-sm">
                            <option value="">Tất cả trạng thái</option>
                            <option value="Đang mượn">Đang mượn</option>
                            <option value="Đã trả">Đã trả</option>
                        </select>
                    </div>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-slate-50 text-slate-600 uppercase text-xs font-semibold border-b">
                            <tr>
                                <th class="p-4">Người mượn / Lớp</th>
                                <th class="p-4">Thiết bị mượn</th>
                                <th class="p-4">SL</th>
                                <th class="p-4">Ngày mượn</th>
                                <th class="p-4">Hạn trả</th>
                                <th class="p-4">Trạng thái</th>
                                <th class="p-4 text-center">Hành động</th>
                            </tr>
                        </thead>
                        <tbody id="logs-table-body" class="divide-y divide-slate-100">
                            <!-- Javascript rendered -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal Thêm Thiết Bị Mới -->
    <div id="add-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-slate-800 text-lg">Thêm Thiết Bị Vào Kho</h3>
                <button onclick="closeAddDeviceModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <form id="add-device-form" onsubmit="handleAddDevice(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">Tên thiết bị / Dụng cụ</label>
                    <input type="text" id="new-name" required placeholder="Kính hiển vi quang học" class="w-full px-3 py-2 border rounded-lg text-sm">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Mã thiết bị</label>
                        <input type="text" id="new-code" required placeholder="KHV-01" class="w-full px-3 py-2 border rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Danh mục</label>
                        <select id="new-category" required class="w-full px-3 py-2 border rounded-lg text-sm bg-white">
                            <option value="Thực hành">Thực hành Lý - Hóa - Sinh</option>
                            <option value="Công nghệ">Công nghệ & Máy tính</option>
                            <option value="Thể thao">Dụng cụ Thể thao</option>
                            <option value="Âm nhạc">Dụng cụ Âm nhạc</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Tổng số lượng</label>
                        <input type="number" id="new-total" min="1" required placeholder="10" class="w-full px-3 py-2 border rounded-lg text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Vị trí lưu kho</label>
                        <input type="text" id="new-location" required placeholder="Phòng Lab 2 - Tủ B" class="w-full px-3 py-2 border rounded-lg text-sm">
                    </div>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeAddDeviceModal()" class="px-4 py-2 border rounded-lg text-sm font-medium hover:bg-slate-50">Hủy</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700">Lưu thiết bị</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Logic App -->
    <script>
        // Dữ liệu mẫu khởi tạo
        let devices = [
            { id: 1, code: 'KHV-01', name: 'Kính hiển vi quang học', category: 'Thực hành', total: 15, available: 10, location: 'Phòng Lab Sinh Học' },
            { id: 2, code: 'MT-PRO-02', name: 'Máy chiếu Epson 4K', category: 'Công nghệ', total: 5, available: 3, location: 'Kho BGH - Tầng 2' },
            { id: 3, code: 'BONG-RO-01', name: 'Bóng rổ Molten tiêu chuẩn', category: 'Thể thao', total: 20, available: 12, location: 'Nhà Thi Đấu' },
            { id: 4, code: 'DAN-GUITAR-01', name: 'Đàn Guitar Acoustic Yamaha', category: 'Âm nhạc', total: 8, available: 8, location: 'Phòng Âm Nhạc' }
        ];

        let borrowLogs = [
            { id: 101, deviceId: 1, deviceName: 'Kính hiển vi quang học', borrowerName: 'Bùi Duy An', role: 'Lớp 11A1', quantity: 2, borrowDate: '2026-10-10', dueDate: '2026-10-15', status: 'Đang mượn', note: 'Thực hành sinh học tế bào' },
            { id: 102, deviceId: 2, deviceName: 'Máy chiếu Epson 4K', borrowerName: 'Thầy Nguyễn Văn Bình', role: 'Giáo viên Vật Lý', quantity: 1, borrowDate: '2026-10-08', dueDate: '2026-10-12', status: 'Đã trả', note: 'Thuyết trình chuyên đề' }
        ];

        // Chuyển Tab
        function switchTab(tab) {
            document.getElementById('tab-devices').classList.add('hidden');
            document.getElementById('tab-borrow').classList.add('hidden');
            document.getElementById('tab-logs').classList.add('hidden');

            document.getElementById('tab-btn-devices').className = 'px-3 py-2 rounded-lg text-sm font-medium hover:bg-indigo-600 text-indigo-100 transition flex items-center gap-2';
            document.getElementById('tab-btn-borrow').className = 'px-3 py-2 rounded-lg text-sm font-medium hover:bg-indigo-600 text-indigo-100 transition flex items-center gap-2';
            document.getElementById('tab-btn-logs').className = 'px-3 py-2 rounded-lg text-sm font-medium hover:bg-indigo-600 text-indigo-100 transition flex items-center gap-2';

            if(tab === 'devices') {
                document.getElementById('tab-devices').classList.remove('hidden');
                document.getElementById('tab-btn-devices').className = 'px-3 py-2 rounded-lg text-sm font-medium bg-indigo-800 text-white transition flex items-center gap-2';
            } else if(tab === 'borrow') {
                document.getElementById('tab-borrow').classList.remove('hidden');
                document.getElementById('tab-btn-borrow').className = 'px-3 py-2 rounded-lg text-sm font-medium bg-indigo-800 text-white transition flex items-center gap-2';
                populateBorrowSelect();
            } else if(tab === 'logs') {
                document.getElementById('tab-logs').classList.remove('hidden');
                document.getElementById('tab-btn-logs').className = 'px-3 py-2 rounded-lg text-sm font-medium bg-indigo-800 text-white transition flex items-center gap-2';
                renderLogs();
            }
        }

        // Render danh sách thiết bị
        function renderDevices() {
            const grid = document.getElementById('device-grid');
            const search = document.getElementById('search-device').value.toLowerCase();
            const category = document.getElementById('filter-category').value;

            const filtered = devices.filter(d => {
                const matchSearch = d.name.toLowerCase().includes(search) || d.code.toLowerCase().includes(search);
                const matchCat = category === '' || d.category === category;
                return matchSearch && matchCat;
            });

            grid.innerHTML = filtered.map(d => `
                <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-5 flex flex-col justify-between hover:shadow-md transition">
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <span class="text-xs font-semibold px-2.5 py-1 bg-indigo-50 text-indigo-700 rounded-md border border-indigo-100">${d.category}</span>
                            <span class="text-xs text-slate-400 font-mono">Mã: ${d.code}</span>
                        </div>
                        <h3 class="font-bold text-slate-800 text-lg mb-1">${d.name}</h3>
                        <p class="text-xs text-slate-500 mb-4 flex items-center gap-1">
                            <i class="fa-solid fa-location-dot text-slate-400"></i> ${d.location}
                        </p>
                    </div>

                    <div class="border-t pt-3 flex justify-between items-center text-sm">
                        <div>
                            <span class="text-slate-500 text-xs block">Sẵn có / Tổng số:</span>
                            <span class="font-bold ${d.available > 0 ? 'text-emerald-600' : 'text-rose-600'}">${d.available}</span> / <span class="font-bold text-slate-700">${d.total}</span>
                        </div>
                        <button onclick="quickBorrow(${d.id})" ${d.available === 0 ? 'disabled' : ''} class="px-3 py-1.5 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 disabled:opacity-50 disabled:cursor-not-allowed rounded-lg text-xs font-semibold transition">
                            Mượn thiết bị
                        </button>
                    </div>
                </div>
            `).join('');

            updateStats();
        }

        // Cập nhật thống kê
        function updateStats() {
            document.getElementById('stat-total-types').innerText = devices.length;
            const totalAvail = devices.reduce((acc, d) => acc + d.available, 0);
            const totalAll = devices.reduce((acc, d) => acc + d.total, 0);
            document.getElementById('stat-available').innerText = totalAvail;
            document.getElementById('stat-borrowed').innerText = totalAll - totalAvail;
            document.getElementById('stat-broken').innerText = 0;
        }

        // Đưa danh sách vào Select mượn
        function populateBorrowSelect() {
            const select = document.getElementById('borrow-device-id');
            select.innerHTML = devices.map(d => `
                <option value="${d.id}" ${d.available === 0 ? 'disabled' : ''}>
                    ${d.name} (${d.code}) - Có sẵn: ${d.available}
                </option>
            `).join('');
        }

        // Mượn nhanh từ thẻ thiết bị
        function quickBorrow(id) {
            switchTab('borrow');
            document.getElementById('borrow-device-id').value = id;
        }

        // Xử lý tạo phiếu mượn
        function handleCreateBorrow(e) {
            e.preventDefault();
            const deviceId = parseInt(document.getElementById('borrow-device-id').value);
            const name = document.getElementById('borrower-name').value;
            const role = document.getElementById('borrower-role').value;
            const qty = parseInt(document.getElementById('borrow-quantity').value);
            const dueDate = document.getElementById('borrow-due-date').value;
            const purpose = document.getElementById('borrow-purpose').value;

            const device = devices.find(d => d.id === deviceId);
            if (!device || device.available < qty) {
                alert('Số lượng tồn trong kho không đủ để cho mượn!');
                return;
            }

            // Trừ số lượng sẵn có
            device.available -= qty;

            // Thêm lịch sử mượn
            const newLog = {
                id: Date.now(),
                deviceId: device.id,
                deviceName: device.name,
                borrowerName: name,
                role: role,
                quantity: qty,
                borrowDate: new Date().toISOString().split('T')[0],
                dueDate: dueDate,
                status: 'Đang mượn',
                note: purpose
            };

            borrowLogs.unshift(newLog);
            alert('Tạo phiếu cho mượn thành công!');
            document.getElementById('borrow-form').reset();
            switchTab('logs');
            renderDevices();
        }

        // Render danh sách phiếu mượn
        function renderLogs() {
            const tbody = document.getElementById('logs-table-body');
            const filter = document.getElementById('filter-log-status').value;

            const filtered = borrowLogs.filter(l => filter === '' || l.status === filter);

            tbody.innerHTML = filtered.map(l => `
                <tr class="hover:bg-slate-50 transition">
                    <td class="p-4">
                        <div class="font-semibold text-slate-800">${l.borrowerName}</div>
                        <div class="text-xs text-slate-500">${l.role}</div>
                    </td>
                    <td class="p-4 font-medium text-slate-700">${l.deviceName}</td>
                    <td class="p-4 font-bold text-indigo-600">${l.quantity}</td>
                    <td class="p-4 text-xs text-slate-500">${l.borrowDate}</td>
                    <td class="p-4 text-xs text-slate-500">${l.dueDate}</td>
                    <td class="p-4">
                        <span class="px-2.5 py-1 text-xs font-semibold rounded-full ${l.status === 'Đang mượn' ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700'}">
                            ${l.status}
                        </span>
                    </td>
                    <td class="p-4 text-center">
                        ${l.status === 'Đang mượn' ? `
                            <button onclick="returnDevice(${l.id})" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-xs font-medium transition">
                                <i class="fa-solid fa-rotate-left mr-1"></i> Xác nhận trả
                            </button>
                        ` : '<span class="text-xs text-slate-400">Hoàn thành</span>'}
                    </td>
                </tr>
            `).join('');
        }

        // Xử lý khi trả thiết bị
        function returnDevice(logId) {
            const log = borrowLogs.find(l => l.id === logId);
            if (log && log.status === 'Đang mượn') {
                log.status = 'Đã trả';
                const device = devices.find(d => d.id === log.deviceId);
                if (device) {
                    device.available += log.quantity;
                }
                renderLogs();
                renderDevices();
            }
        }

        // Modal Thêm Thiết Bị
        function openAddDeviceModal() {
            document.getElementById('add-modal').classList.remove('hidden');
            document.getElementById('add-modal').classList.add('flex');
        }

        function closeAddDeviceModal() {
            document.getElementById('add-modal').classList.add('hidden');
            document.getElementById('add-modal').classList.remove('flex');
        }

        function handleAddDevice(e) {
            e.preventDefault();
            const name = document.getElementById('new-name').value;
            const code = document.getElementById('new-code').value;
            const category = document.getElementById('new-category').value;
            const total = parseInt(document.getElementById('new-total').value);
            const location = document.getElementById('new-location').value;

            devices.push({
                id: Date.now(),
                code, name, category, total, available: total, location
            });

            closeAddDeviceModal();
            document.getElementById('add-device-form').reset();
            renderDevices();
        }

        // Khởi chạy ban đầu
        renderDevices();
    </script>
</body>
</html>
