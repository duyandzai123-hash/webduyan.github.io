<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Nhắn Tin</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #e9eef5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-app {
            width: 420px;
            height: 650px;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 35px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
        }

        /* Thanh trên */
        .header {
            background: #1877f2;
            color: white;
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 45px;
            height: 45px;
            background: white;
            color: #1877f2;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 20px;
        }

        .header-info h2 {
            font-size: 18px;
        }

        .online {
            font-size: 13px;
            opacity: 0.9;
            margin-top: 3px;
        }

        /* Khu vực tin nhắn */
        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f5f7fb;
        }

        .message {
            max-width: 75%;
            padding: 11px 15px;
            margin-bottom: 12px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .received {
            background: white;
            color: #222;
            border-bottom-left-radius: 5px;
            margin-right: auto;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .sent {
            background: #1877f2;
            color: white;
            border-bottom-right-radius: 5px;
            margin-left: auto;
        }

        .time {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 4px;
            text-align: right;
        }

        /* Ô nhập */
        .input-area {
            padding: 12px;
            background: white;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 8px;
        }

        #messageInput {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 25px;
            padding: 12px 16px;
            outline: none;
            font-size: 15px;
        }

        #messageInput:focus {
            border-color: #1877f2;
        }

        #sendButton {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: #1877f2;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }

        #sendButton:hover {
            background: #0d65d9;
        }

        @media (max-width: 500px) {
            body {
                background: white;
            }

            .chat-app {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

<div class="chat-app">

    <!-- Header -->
    <div class="header">
        <div class="avatar">A</div>

        <div class="header-info">
            <h2>Người bạn</h2>
            <div class="online">● Đang hoạt động</div>
        </div>
    </div>

    <!-- Tin nhắn -->
    <div class="messages" id="messages">

        <div class="message received">
            Xin chào 👋
            <div class="time">09:40</div>
        </div>

        <div class="message received">
            Đây là web nhắn tin của bạn!
            <div class="time">09:41</div>
        </div>

        <div class="message sent">
            Xin chào 😎
            <div class="time">09:42</div>
        </div>

    </div>

    <!-- Nhập tin nhắn -->
    <div class="input-area">

        <input
            type="text"
            id="messageInput"
            placeholder="Nhập tin nhắn..."
            autocomplete="off"
        >

        <button id="sendButton">➤</button>

    </div>

</div>


<script>

    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const messages = document.getElementById("messages");

    function sendMessage() {

        const text = input.value.trim();

        if (text === "") {
            return;
        }

        // Tạo tin nhắn
        const message = document.createElement("div");
        message.className = "message sent";

        // Lấy giờ hiện tại
        const now = new Date();

        const hours = String(now.getHours()).padStart(2, "0");
        const minutes = String(now.getMinutes()).padStart(2, "0");

        message.innerHTML = `
            ${escapeHTML(text)}
            <div class="time">${hours}:${minutes}</div>
        `;

        messages.appendChild(message);

        // Xóa ô nhập
        input.value = "";

        // Cuộn xuống cuối
        messages.scrollTop = messages.scrollHeight;

        // Lưu tin nhắn
        saveMessages();
    }


    // Nhấn nút gửi
    sendButton.addEventListener("click", sendMessage);


    // Nhấn Enter để gửi
    input.addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            sendMessage();
        }

    });


    // Chống HTML injection
    function escapeHTML(text) {

        const div = document.createElement("div");

        div.textContent = text;

        return div.innerHTML;

    }


    // Lưu tin nhắn vào trình duyệt
    function saveMessages() {

        localStorage.setItem(
            "chatMessages",
            messages.innerHTML
        );

    }


    // Tải lại tin nhắn đã lưu
    function loadMessages() {

        const saved = localStorage.getItem("chatMessages");

        if (saved) {
            messages.innerHTML = saved;
        }

        messages.scrollTop = messages.scrollHeight;

    }


    loadMessages();

</script>

</body>
</html>
