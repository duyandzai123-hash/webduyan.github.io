<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Database Studio - Trình Quản Lý & Thực Hành SQL Căn Bản</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#111827',
                            950: '#0B0F19'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome & SQLite WebAssembly CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0b0f19; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

    <!-- TOP HEADER -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-3 sticky top-0 z-50 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="bg-gradient-to-tr from-blue-600 to-indigo-600 text-white p-2.5 rounded-xl shadow-lg">
                <i class="fa-solid fa-database text-xl"></i>
            </div>
            <div>
                <h1 class="font-extrabold text-lg text-white tracking-tight flex items-center gap-2">
                    SQL <span class="text-blue-500">Studio</span>
                    <span class="text-[10px] font-mono bg-blue-500/10 text-blue-400 border border-blue-500/30 px-2 py-0.5 rounded-full">v1.0 Basic Edition</span>
                </h1>
                <p class="text-xs text-slate-400">Trình quản lý & thực hành CSDL SQL trực quan</p>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <button onclick="resetDatabase()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-lg border border-slate-700 transition flex items-center gap-1.5">
                <i class="fa-solid fa-rotate-left"></i> Khôi phục CSDL gốc
            </button>
            <button onclick="runCurrentQuery()" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-lg shadow-md transition flex items-center gap-1.5">
                <i class="fa-solid fa-play"></i> Chạy Lệnh SQL (F5)
            </button>
        </div>
    </header>

    <!-- MAIN WORKSPACE -->
    <div class="flex-1 flex overflow-hidden">

        <!-- LEFT SIDEBAR: DATABASE TABLES & SCHEMA -->
        <aside class="w-72 bg-slate-900 border-r border-slate-800 flex flex-col overflow-y-auto custom-scrollbar">
            <div class="p-4 border-b border-slate-800 flex items-center justify-between">
                <span class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
                    <i class="fa-solid fa-layer-group text-blue-500"></i> Danh sách Bảng (Tables)
                </span>
                <span id="tables-count" class="text-xs font-mono text-slate-500">0 tables</span>
            </div>

            <div id="sidebar-tables-list" class="p-3 space-y-2">
                <!-- Tables list injected here -->
            </div>
        </aside>

        <!-- RIGHT MAIN CONTENT: SQL EDITOR & RESULTS -->
        <main class="flex-1 flex flex-col min-w-0 bg-slate-950">

            <!-- SQL QUERY CONSOLE -->
            <div class="p-4 bg-slate-900/60 border-b border-slate-800 space-y-3">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-slate-300 flex items-center gap-2">
                        <i class="fa-solid fa-code text-indigo-400"></i> Trình soạn thảo SQL (Console Editor)
                    </span>

                    <!-- SQL PRESET TEMPLATES -->
                    <div class="flex items-center gap-2 text-xs">
                        <span class="text-slate-500">Câu lệnh mẫu:</span>
                        <button onclick="loadPresetQuery('SELECT')" class="text-blue-400 hover:underline">SELECT</button>
                        <button onclick="loadPresetQuery('WHERE')" class="text-blue-400 hover:underline">WHERE</button>
                        <button onclick="loadPresetQuery('JOIN')" class="text-blue-400 hover:underline">JOIN</button>
                        <button onclick="loadPresetQuery('GROUP_BY')" class="text-blue-400 hover:underline">GROUP BY</button>
                        <button onclick="loadPresetQuery('INSERT')" class="text-blue-400 hover:underline">INSERT</button>
                    </div>
                </div>

                <div class="relative">
                    <textarea id="sql-editor" rows="5" spellcheck="false" class="w-full bg-slate-950 font-mono text-sm text-emerald-400 p-4 rounded-xl border border-slate-800 focus:outline-none focus:border-blue-500 shadow-inner custom-scrollbar" placeholder="Nhập câu lệnh SQL vào đây..."></textarea>
                </div>
            </div>

            <!-- RESULT SET / OUTPUT PANEL -->
            <div class="flex-1 p-4 flex flex-col min-h-0 overflow-hidden">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                        <i class="fa-solid fa-table-cells text-emerald-400"></i> Kết quả truy vấn (Result Set)
                    </h3>
                    <div id="execution-info" class="text-xs font-mono text-slate-500">Sẵn sàng</div>
                </div>

                <!-- TABLE RESULT CONTAINER -->
                <div id="output-container" class="flex-1 bg-slate-900 border border-slate-800 rounded-xl overflow-auto custom-scrollbar p-1">
                    <div class="h-full flex flex-col items-center justify-center text-slate-500 space-y-2">
                        <i class="fa-solid fa-terminal text-3xl opacity-30"></i>
                        <p class="text-xs">Nhấn "Chạy Lệnh SQL" để thực thi câu lệnh truy vấn</p>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- APPLICATION LOGIC (SQL.JS + ENGINE) -->
    <script>
        let db = null;

        // Khởi tạo SQLite Engine WebAssembly
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const SQL = await initSqlJs({
                    locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
                });
                db = new SQL.Database();
                initSampleSchema();
                renderSidebarTables();
                loadPresetQuery('SELECT');
                runCurrentQuery();
            } catch (err) {
                console.error("Lỗi khởi tạo SQLite engine:", err);
                document.getElementById('output-container').innerHTML = `
                    <div class="p-4 bg-red-500/10 text-red-400 text-xs rounded-lg border border-red-500/20">
                        <i class="fa-solid fa-triangle-exclamation mr-1"></i> Lỗi khởi tạo thư viện SQL.JS WebAssembly. Vui lòng kiểm tra kết nối mạng.
                    </div>`;
            }
        });

        // Tạo dữ liệu CSDL SQL mẫu
        function initSampleSchema() {
            db.run(`
                DROP TABLE IF EXISTS SinhVien;
                DROP TABLE IF EXISTS LopHoc;
                DROP TABLE IF EXISTS SanPham;

                -- 1. Bảng Lớp Học
                CREATE TABLE LopHoc (
                    MaLop INTEGER PRIMARY KEY AUTO_INCREMENT,
                    TenLop TEXT NOT NULL,
                    Khoa TEXT NOT NULL
                );

                -- 2. Bảng Sinh Viên
                CREATE TABLE SinhVien (
                    MaSV INTEGER PRIMARY KEY,
                    HoTen TEXT NOT NULL,
                    Tuoi INTEGER,
                    QueQuan TEXT,
                    DiemTB REAL,
                    MaLop INTEGER,
                    FOREIGN KEY (MaLop) REFERENCES LopHoc(MaLop)
                );

                -- 3. Bảng Sản Phẩm
                CREATE TABLE SanPham (
                    MaSP INTEGER PRIMARY KEY,
                    TenSP TEXT NOT NULL,
                    DanhMuc TEXT,
                    GiaBan REAL,
                    SoLuongTon INTEGER
                );

                -- Insert dữ liệu mẫu
                INSERT INTO LopHoc VALUES (1, 'CNTT K11', 'Công Nghệ Thông Tin');
                INSERT INTO LopHoc VALUES (2, 'KinhTe K11', 'Kinh Tế Doanh Nghiệp');

                INSERT INTO SinhVien VALUES (101, 'Nguyễn Văn An', 17, 'Lào Cai', 8.5, 1);
                INSERT INTO SinhVien VALUES (102, 'Trần Thị Bình', 18, 'Hà Nội', 7.8, 1);
                INSERT INTO SinhVien VALUES (103, 'Lê Hoàng Cường', 17, 'Đà Nẵng', 9.0, 2);
                INSERT INTO SinhVien VALUES (104, 'Phạm Minh Đức', 18, 'Lào Cai', 6.5, 1);

                INSERT INTO SanPham VALUES (1, 'Laptop Dell XPS 13', 'Máy Tính', 28500000, 10);
                INSERT INTO SanPham VALUES (2, 'Chuột Không Dây Logitech', 'Phụ Kiện', 450000, 50);
                INSERT INTO SanPham VALUES (3, 'Bàn Phím Cơ AKKO', 'Phụ Kiện', 1250000, 25);
            `);
        }

        // Render danh sách Bảng lên Sidebar
        function renderSidebarTables() {
            const list = document.getElementById('sidebar-tables-list');
            list.innerHTML = '';

            const res = db.exec("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%';");
            if (res.length === 0) return;

            const tables = res[0].values;
            document.getElementById('tables-count').innerText = `${tables.length} tables`;

            tables.forEach(([tableName]) => {
                const schemaRes = db.exec(`PRAGMA table_info(${tableName});`);
                const columns = schemaRes[0].values;

                let colsHtml = columns.map(c => `
                    <div class="flex items-center justify-between text-[11px] text-slate-400 pl-4 py-0.5 font-mono">
                        <span><i class="fa-solid fa-columns text-slate-600 mr-1.5"></i>${c[1]}</span>
                        <span class="text-slate-600 text-[10px]">${c[2]}</span>
                    </div>
                `).join('');

                list.innerHTML += `
                    <div class="bg-slate-950 rounded-lg border border-slate-800/80 overflow-hidden">
                        <button onclick="loadPresetQueryForTable('${tableName}')" class="w-full text-left px-3 py-2 bg-slate-850 hover:bg-slate-800 font-mono text-xs font-bold text-slate-200 flex items-center justify-between">
                            <span class="flex items-center gap-1.5"><i class="fa-solid fa-table text-blue-400"></i> ${tableName}</span>
                            <i class="fa-solid fa-[#fa-angle-right] text-slate-500 text-[10px]"></i>
                        </button>
                        <div class="py-1 border-t border-slate-800/50 bg-slate-950/50">
                            ${colsHtml}
                        </div>
                    </div>
                `;
            });
        }

        // Chạy câu lệnh SQL từ Textarea
        function runCurrentQuery() {
            const sql = document.getElementById('sql-editor').value.trim();
            const output = document.getElementById('output-container');
            const executionInfo = document.getElementById('execution-info');

            if (!sql) {
                output.innerHTML = `<div class="p-4 text-xs text-amber-400"><i class="fa-solid fa-triangle-exclamation mr-1"></i> Vui lòng nhập câu lệnh SQL.</div>`;
                return;
            }

            const startTime = performance.now();

            try {
                const results = db.exec(sql);
                const endTime = performance.now();
                const execTime = (endTime - startTime).toFixed(2);

                if (results.length === 0) {
                    executionInfo.innerHTML = `<span class="text-emerald-400"><i class="fa-solid fa-check mr-1"></i>Thực thi thành công (${execTime} ms)</span>`;
                    output.innerHTML = `
                        <div class="p-4 text-xs text-emerald-400 flex items-center gap-2">
                            <i class="fa-solid fa-circle-check text-base"></i> Câu lệnh đã thực thi thành công (0 dòng trả về hoặc đã cập nhật dữ liệu).
                        </div>`;
                    renderSidebarTables(); // Cập nhật lại sidebar nếu có CREATE/DROP
                    return;
                }

                const columns = results[0].columns;
                const values = results[0].values;

                executionInfo.innerHTML = `<span class="text-slate-400">${values.length} dòng (${execTime} ms)</span>`;

                let headerHtml = columns.map(col => `<th class="px-4 py-2.5 font-mono text-xs font-semibold text-slate-300 border-b border-slate-800 bg-slate-950/80">${col}</th>`).join('');
                
                let rowsHtml = values.map((row, idx) => {
                    let cols = row.map(val => `<td class="px-4 py-2 text-xs font-mono text-slate-300 border-b border-slate-800/60">${val === null ? '<span class="text-slate-600 italic">NULL</span>' : val}</td>`).join('');
                    return `<tr class="hover:bg-slate-800/50 transition">${cols}</tr>`;
                }).join('');

                output.innerHTML = `
                    <div class="overflow-x-auto h-full">
                        <table class="w-full text-left border-collapse">
                            <thead class="sticky top-0 z-10">${headerHtml}</thead>
                            <tbody>${rowsHtml}</tbody>
                        </table>
                    </div>`;

            } catch (err) {
                executionInfo.innerHTML = `<span class="text-red-400"><i class="fa-solid fa-xmark mr-1"></i>Lỗi Cú Pháp SQL</span>`;
                output.innerHTML = `
                    <div class="p-4 bg-red-500/10 text-red-400 font-mono text-xs rounded-lg border border-red-500/20 space-y-1">
                        <div class="font-bold flex items-center gap-1.5"><i class="fa-solid fa-circle-xmark"></i> SQL Error:</div>
                        <div>${err.message}</div>
                    </div>`;
            }
        }

        // nạp các câu lệnh mẫu
        function loadPresetQuery(type) {
            const editor = document.getElementById('sql-editor');
            if (type === 'SELECT') {
                editor.value = "SELECT * FROM SinhVien;";
            } else if (type === 'WHERE') {
                editor.value = "SELECT HoTen, Tuoi, DiemTB \nFROM SinhVien \nWHERE DiemTB >= 8.0 AND QueQuan = 'Lào Cai';";
            } else if (type === 'JOIN') {
                editor.value = "SELECT SinhVien.MaSV, SinhVien.HoTen, LopHoc.TenLop, LopHoc.Khoa \nFROM SinhVien \nINNER JOIN LopHoc ON SinhVien.MaLop = LopHoc.MaLop;";
            } else if (type === 'GROUP_BY') {
                editor.value = "SELECT QueQuan, COUNT(*) AS SoLuongSV, AVG(DiemTB) AS DiemTrungBinh \nFROM SinhVien \nGROUP BY QueQuan;";
            } else if (type === 'INSERT') {
                editor.value = "INSERT INTO SinhVien (MaSV, HoTen, Tuoi, QueQuan, DiemTB, MaLop) \nVALUES (105, 'Bùi Duy An', 17, 'Lào Cai', 9.2, 1);\n\nSELECT * FROM SinhVien;";
            }
            runCurrentQuery();
        }

        function loadPresetQueryForTable(tableName) {
            document.getElementById('sql-editor').value = `SELECT * FROM ${tableName};`;
            runCurrentQuery();
        }

        function resetDatabase() {
            if (confirm("Khôi phục lại toàn bộ cơ sở dữ liệu mẫu ban đầu?")) {
                initSampleSchema();
                renderSidebarTables();
                loadPresetQuery('SELECT');
            }
        }

        // Bắt phím tắt F5 hoặc Ctrl+Enter để chạy Query
        document.addEventListener('keydown', (e) => {
            if (e.key === 'F5' || (e.ctrlKey && e.key === 'Enter')) {
                e.preventDefault();
                runCurrentQuery();
            }
        });
    </script>
</body>
</html>
